<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.url == "/" %}<title>{{ page.title }}</title>{% else %}<title>{{ page.title }} · Solera Polo</title>{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta name="theme-color" content="#FAF8F4">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/bodoni-moda.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Solera Polo">
<meta property="og:locale" content="en_GB">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ page.og_title | default: page.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Solera Polo, boutique polo services in Sotogrande and Argentina">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.og_title | default: page.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}/og-image.jpg">
<meta name="geo.region" content="ES-AN">
<meta name="geo.placename" content="Sotogrande">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsActivityLocation",
  "@id": "{{ site.url }}/#business",
  "name": "Solera Polo",
  "url": "{{ site.url }}/",
  "description": "{{ site.description }}",
  "email": "{{ site.email }}",
  "telephone": "+5493584268818",
  "sport": "Polo",
  "priceRange": "€€€",
  "image": "{{ site.url }}/og-image.jpg",
  "address": {"@type": "PostalAddress", "addressLocality": "Sotogrande", "addressRegion": "Andalucía", "addressCountry": "ES"},
  "areaServed": [
    {"@type": "Place", "name": "Sotogrande, Spain"},
    {"@type": "Place", "name": "Pilar, Argentina"},
    {"@type": "Place", "name": "Río Cuarto, Argentina"},
    {"@type": "Place", "name": "Europe"}
  ],
  "sameAs": ["{{ site.instagram_url }}"],
  "founder": [
    {"@type": "Person", "name": "Luis Benmergui", "jobTitle": "Professional polo player and equine veterinarian"},
    {"@type": "Person", "name": "Polina Nazarova", "jobTitle": "Professional polo player"}
  ],
  "makesOffer": [
    {% for item in site.data.prices.items %}{"@type": "Offer", "name": "{{ item.name }}", "description": "{{ item.note }}. {{ site.data.prices.conditions }}", "priceCurrency": "EUR", "price": "{{ item.price | remove: 'from ' | remove: ' €' }}", "url": "{{ site.url }}/services/#rental"}{% unless forloop.last %},
    {% endunless %}{% endfor %},
    {"@type": "Offer", "name": "Polo lessons and coaching", "url": "{{ site.url }}/services/#coaching"},
    {"@type": "Offer", "name": "Pro hire", "url": "{{ site.url }}/services/#pro-hire"},
    {"@type": "Offer", "name": "Corporate and leadership experiences", "url": "{{ site.url }}/corporate/"},
    {"@type": "Offer", "name": "Polo horses for sale", "url": "{{ site.url }}/horses/#for-sale"}
  ]
}
</script>
</head>
<body class="{% if page.hero %}has-hero{% endif %}">
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% unless page.no_band %}{% include band.html %}{% endunless %}
{% include footer.html %}
<script src="/assets/js/site.js" defer></script>
</body>
</html>
