<section class="band" aria-labelledby="band-title">
  <div class="band-inner">
    <div class="band-text">
      <h2 class="band-title" id="band-title">Let's talk polo.</h2>
      <p class="band-sub">Talk to Polina or Luis.</p>
    </div>
    <div class="band-actions">
      <a class="link link-cream" href="/contact/">Get in touch</a>
      <a class="band-wa" href="{{ site.whatsapp_link }}">{% include icon-whatsapp.svg %}<span>WhatsApp {{ site.whatsapp_number }}</span></a>
    </div>
    <div class="band-mallet" aria-hidden="true">{% include mallet.svg %}</div>
  </div>
</section>
